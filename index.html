  <style>
    * { box-sizing: border-box; }

    html, body { height: auto; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main.panel{
      flex: 1;
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background-image: url("ocean1.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .topbar{
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
    }

    .nav{
      pointer-events: auto;
      display: flex;
      gap: 34px;
      align-items: center;
      font-size: 13px;
      letter-spacing: .2px;
      color: rgba(0,0,0,.55);
      user-select: none;
    }

    .nav a{
      text-decoration: none;
      color: inherit;
      padding: 6px 2px;
      position: relative;
    }

    .nav a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:0;
      width:0%;
      height:1px;
      background: rgba(0,0,0,.45);
      transition: width .25s ease;
    }

    .nav a:hover::after{ width:100%; }

    .search{
      pointer-events: auto;
      position: absolute;
      right: 22px;
      top: 0;
      height: 28px;
      width: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: rgba(0,0,0,.55);
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    .search:hover{
      background: rgba(255,255,255,.55);
      transform: translateY(-1px);
    }

    .social{
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 5;
    }

    .social a{
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: rgba(0,0,0,.55);
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    .social a:hover{
      transform: translateX(-2px);
      background: rgba(255,255,255,.55);
    }

    .site-footer{
  padding: 18px 16px;
  border-top: 1px solid rgba(255,255,255,0.18);
  background: #0F2854; 
}


   .footer-inner{
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  color: rgba(255,255,255,0.9);
  font-size: 14px;
}


    .site-footer a{
  color: rgba(255,255,255,0.9);
  text-decoration: none;
}


    .site-footer a:hover{
      text-decoration: underline;
    }

    .dot{
      margin: 0 8px;
      opacity: 0.7;
    }

    @media (max-width: 520px){
      .nav{ gap: 18px; font-size: 12px; }
      .topbar{ padding: 0 14px; }
      .search{ right: 14px; }
      .social{ right: 10px; }
      .footer-inner{ justify-content: center; text-align: center; }
    }
    html, body{
  height: auto !important;
  min-height: 100% !important;
  overflow: auto !important;
}

body{
  min-height: 100vh !important;
  display: flex !important;
  flex-direction: column !important;
}

main.panel{
  flex: 1 !important;
  min-height: 100vh !important;
}
  </style>
