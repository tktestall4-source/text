<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Full Panel Layout</title>
<link rel="stylesheet" href="loader.css">

  <!-- Font Awesome icons -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
.site-footer{
  padding: 18px 16px;
  margin-top: 40px;
  border-top: 1px solid rgba(255,255,255,0.18);
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);
}

.footer-inner{
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  color: rgba(255,255,255,0.85);
  font-size: 14px;
}

.site-footer a{
  color: rgba(255,255,255,0.9);
  text-decoration: none;
}

.site-footer a:hover{
  text-decoration: underline;
}

.dot{
  margin: 0 8px;
  opacity: 0.7;
}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #ffffff; /* không cần nhưng để rõ */
    }

    /* FULL MÀN HÌNH (phần bạn gọi là "phần ở giữa") */
  .panel{
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;

  /* NỀN ẢNH */
  background-image: url("ocean1.png"); /* đổi tên nếu ảnh khác */
  background-size: cover;        /* phủ kín màn hình */
  background-position: center;   /* không lệch */
  background-repeat: no-repeat;

  border-radius: 0;
  box-shadow: none;
  border: none;
}

    /* TOP BAR */
    .topbar{
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
    }

    .nav{
      pointer-events: auto;
      display: flex;
      gap: 34px;
      align-items: center;
      font-size: 13px;
      letter-spacing: .2px;
      color: rgba(0,0,0,.55);
      user-select: none;
    }

    .nav a{
      text-decoration: none;
      color: inherit;
      padding: 6px 2px;
      position: relative;
    }

    .nav a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:0;
      width:0%;
      height:1px;
      background: rgba(0,0,0,.45);
      transition: width .25s ease;
    }
    .nav a:hover::after{ width:100%; }

    .search{
      pointer-events: auto;
      position: absolute;
      right: 22px;
      top: 0;
      height: 28px;
      width: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: rgba(0,0,0,.55);
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .search:hover{
      background: rgba(255,255,255,.55);
      transform: translateY(-1px);
    }

    /* SOCIAL ICONS (bên phải) */
    .social{
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 5;
    }

    .social a{
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: rgba(0,0,0,.55);
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    .social a:hover{
      transform: translateX(-2px);
      background: rgba(255,255,255,.55);
    }

    /* Responsive */
    @media (max-width: 520px){
      .nav{ gap: 18px; font-size: 12px; }
      .topbar{ padding: 0 14px; }
      .search{ right: 14px; }
      .social{ right: 10px; }
    }
  </style>
</head>

<body>
  <main class="panel">

        <a href="#">Home</a>

      </nav>

      <div class="search" title="Search">

    <aside class="social" aria-label="Social Links">

      <a href="https://www.instagram.com/nguyn.minh859/" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://x.com/NguynMinht457" title="Twitter/X"><i class="fa-brands fa-x-twitter"></i></a>
    </aside>
  </main>
